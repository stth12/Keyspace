name: onlinekeygen
services:
  postgres:
    image: postgres:17.6-alpine
    environment:
      POSTGRES_DB: licensing
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Run setup:dev}
    ports: ["127.0.0.1:15432:5432"]
    volumes: ["postgres-data:/var/lib/postgresql/data"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d licensing"]
      interval: 5s
      timeout: 3s
      retries: 20
  redis:
    image: redis:7.4-alpine
    command: ["redis-server", "--requirepass", "${REDIS_PASSWORD:?Run setup:dev}", "--maxmemory", "128mb", "--maxmemory-policy", "noeviction"]
    ports: ["127.0.0.1:56379:6379"]
    healthcheck:
      test: ["CMD-SHELL", "REDISCLI_AUTH=$$REDIS_PASSWORD redis-cli ping"]
      interval: 5s
      timeout: 3s
      retries: 20
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD}
  backend:
    profiles: ["full"]
    build: {context: ., target: api}
    env_file: .env
    environment:
      NODE_ENV: development
      HOST: 0.0.0.0
      WEB_ORIGIN: http://localhost:8080
      RP_ID: localhost
      DATABASE_URL: postgresql://lk_runtime:${RUNTIME_DB_PASSWORD}@postgres:5432/licensing
      REDIS_URL: redis://:${REDIS_PASSWORD}@redis:6379
    volumes: ["./.secrets:/app/.secrets:ro"]
    depends_on:
      postgres: {condition: service_healthy}
      redis: {condition: service_healthy}
  frontend:
    profiles: ["full"]
    build: {context: ., target: web}
    environment: {API_INTERNAL_URL: "http://backend:4000"}
  worker:
    profiles: ["full"]
    build: {context: ., target: worker}
    environment:
      NODE_ENV: development
      DATABASE_URL: postgresql://lk_runtime:${RUNTIME_DB_PASSWORD}@postgres:5432/licensing
    volumes: ["./artifacts:/app/artifacts"]
    depends_on:
      postgres: {condition: service_healthy}
  reverse-proxy:
    profiles: ["full"]
    image: caddy:2-alpine
    ports: ["127.0.0.1:8080:80"]
    volumes: ["./infra/caddy/Caddyfile.dev:/etc/caddy/Caddyfile:ro"]
    depends_on: [frontend,backend]
volumes:
  postgres-data:
